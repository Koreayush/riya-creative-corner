    :root {
      --canvas: #FCF6EA;
      --canvas2: #F5EBD8;
      --ink: #2E2A20;
      --ink-soft: #726A57;
      --petal: #D9838D;
      --petal-deep: #AD5761;
      --leaf: #69805A;
      --leaf-deep: #425234;
      --plum: #5B3C4E;
      --gold: #CB9A47;
      --cream: #FFFDF8;
    }

    html,
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
    }

    .rcc-display {
      font-family: 'Fraunces', serif;
    }

    .rcc-body {
      font-family: 'Work Sans', sans-serif;
    }

    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--petal-deep);
      border-radius: 99px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .petal-drift {
        animation: drift linear infinite;
      }

      .bloom {
        animation: bloom 0.7s cubic-bezier(.22, 1, .36, 1) both;
      }

      .sway {
        animation: sway 6s ease-in-out infinite;
        transform-origin: bottom center;
      }

      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity .7s ease, transform .7s ease;
      }

      .reveal.in {
        opacity: 1;
        transform: none;
      }

      .flower-pop {
        animation: flowerPop .5s cubic-bezier(.34, 1.56, .64, 1) both;
      }

      .flower-head {
        transform-origin: 0px 0px;
        animation: flowerHeadPop 0.45s cubic-bezier(.34, 1.56, .64, 1) both;
      }

      .stem-draw {
        animation: drawStem 1.1s ease forwards;
      }
    }

    @keyframes drift {
      0% {
        transform: translate(0, -10vh) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: .55;
      }

      92% {
        opacity: .45;
      }

      100% {
        transform: translate(20px, 115vh) rotate(220deg);
        opacity: 0;
      }
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: scale(.4) rotate(-14deg);
      }

      60% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(2deg);
      }
    }

    @keyframes flowerPop {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-40deg);
      }

      70% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes flowerHeadPop {
      0% {
        opacity: 0;
        transform: scale(0.1) rotate(-18deg);
      }

      70% {
        opacity: 1;
        transform: scale(1.14) rotate(3deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes drawStem {
      from {
        stroke-dashoffset: 220;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .photo-zoom {
      transition: transform 0.4s cubic-bezier(.16, 1, .3, 1);
    }

    .photo-zoom:hover {
      transform: scale(1.05);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

        io.observe(el);
        return () => io.disconnect();

    function FloatingPetals({ count = 10 }) {
      const petals = useMemo(() => Array.from({ length: count }, (_, i) => ({

      })), [count]);
      return (
        <div className="pointer-events-none fixed inset-0 overflow-hidden" style={{ zIndex: 0 }}>
          {petals.map((p, i) => (
            <div key={i} className="petal-drift absolute" style={{ left: `${p.left}%`, top: 0, animationDuration: `${p.dur}s`, animationDelay: `${p.delay}s` }}>

        </div>

          category: product.category,

      const total = subtotal + (items.length > 0 ? DELIVERY_FEE : 0);

    // -------------------------------------------------------------------------------------
    // BOUQUET BUILDER (PRESERVED & ENHANCED VISUALIZER)
    // -------------------------------------------------------------------------------------
    function FlowerBloom({ type, color, size = 36, delay = 0 }) {
      const scale = size / 36;

      if (type === "sunflower") {
        // Sun-Kissed Golden Chenille Sunflower:
        // Radiating chenille petals with detailed textured dark brown center disc
        const petalAngles = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
        return (
          <g className="flower-head" style={{ animationDelay: `${delay}ms` }} transform={`scale(${scale})`}>
            {/* Radiating golden petals */}
            {petalAngles.map((deg, j) => (
              <g key={j} transform={`rotate(${deg})`}>
                <path
                  d="M-3.5,-16 C-4.5,-10 -2,-6 0,0 C2,-6 4.5,-10 3.5,-16 C2,-18.5 -2,-18.5 -3.5,-16 Z"
                  fill={j % 2 === 0 ? "#FFC107" : "#FFB300"}
                  stroke="#D48E06"
                  strokeWidth="0.5"
                />
              </g>
            ))}
            {/* Chenille textured brown center */}
            <circle cx="0" cy="0" r="7.5" fill="#4E342E" />
            <circle cx="0" cy="0" r="5.5" fill="#3E2723" />
            <circle cx="0" cy="0" r="4.2" fill="none" stroke="#8D6E63" strokeWidth="1" strokeDasharray="1.5,1.5" />
            <circle cx="0" cy="0" r="2" fill="#2E1B10" />
          </g>
        );
      }

      if (type === "tulip") {
        // Pastel Cup Tulip:
        // Graceful chalice petals with two-tone depth and calyx
        const baseColor = color || "#E3A9B4";
        return (
          <g className="flower-head" style={{ animationDelay: `${delay}ms` }} transform={`scale(${scale})`}>
            <path d="M-5,10 Q0,15 5,10 Q0,6 -5,10" fill="#69805A" />
            <path d="M-7,4 C-9,-6 0,-16 0,-16 C0,-16 9,-6 7,4 C5,10 -5,10 -7,4 Z" fill={baseColor} opacity="0.85" />
            <path d="M-10,2 C-12,-8 -3,-14 -1,-13 C-1,-8 -3,6 -6,10 C-8,10 -10,7 -10,2 Z" fill={baseColor} />
            <path d="M10,2 C12,-8 3,-14 1,-13 C1,-8 3,6 6,10 C8,10 10,7 10,2 Z" fill={baseColor} opacity="0.9" />
            <path d="M-2,-2 C-2,-10 2,-10 2,-2 C2,5 -2,5 -2,-2 Z" fill="#FFF" opacity="0.3" />
          </g>
        );
      }

      if (type === "lily" || type === "bluelily" || type === "magentalily") {
        // Velvet Star Lily:
        // 6 star-flared tapered petals with ruffled edges and pollen stamens
        const isBlue = type === "bluelily";
        const isMagenta = type === "magentalily";
        const petalFill = isBlue ? "#1976D2" : isMagenta ? "#C2185B" : (color || "#F48FB1");
        const edgeStroke = isBlue ? "#80D8FF" : "#FFFFFF";
        return (
          <g className="flower-head" style={{ animationDelay: `${delay}ms` }} transform={`scale(${scale})`}>
            {[0, 60, 120, 180, 240, 300].map((deg, j) => (
              <path
                key={deg}
                d="M0,0 C-5,-6 -4,-17 0,-18 C4,-17 5,-6 0,0 Z"
                fill={petalFill}
                stroke={edgeStroke}
                strokeWidth="0.8"
                strokeLinejoin="round"
                opacity={j % 2 === 0 ? 0.95 : 1}
                transform={`rotate(${deg})`}
              />
            ))}
            <circle cx="0" cy="0" r="3" fill="#FFFDE7" />
            {[30, 90, 150, 210, 270, 330].map((deg) => (
              <g key={deg} transform={`rotate(${deg})`}>
                <line x1="0" y1="0" x2="0" y2="-7" stroke="#425234" strokeWidth="0.8" />
                <circle cx="0" cy="-7.5" r="1.2" fill="#E65100" />
              </g>
            ))}
          </g>
        );
      }

      // Red Rose / Default Velvet Rose:
      // Concentric spiral velvet chenille petals
      const roseFill = color || "#A5423A";
      return (
        <g className="flower-head" style={{ animationDelay: `${delay}ms` }} transform={`scale(${scale})`}>
          <path d="M-6,9 Q0,13 6,9 Q0,5 -6,9" fill="#425234" />
          <circle cx="0" cy="0" r="14" fill={roseFill} />
          <path d="M-12,-4 C-14,6 0,13 8,6 C13,-1 6,-11 -3,-10 C-8,-9 -13,-4 -12,-4 Z" fill="#781D25" opacity="0.5" />
          <path d="M-8,-2 C-10,4 2,9 6,3 C9,-2 4,-8 -1,-7 C-5,-6 -9,-2 -8,-2 Z" fill={roseFill} opacity="0.9" />
          <path d="M-5,-1 C-6,3 2,6 4,1 C6,-2 2,-5 -1,-4 C-3,-4 -5,-1 -5,-1 Z" fill="#5A1219" opacity="0.65" />
          <ellipse cx="0" cy="0" rx="2.5" ry="1.8" fill="#3D0B10" />
        </g>
      );
    }

    function BouquetPreview({ qty, colors, wrapId, hasRibbon, hasCard, hasNametag, hasPearls }) {
      const wrap = WRAPS.find(w => w.id === wrapId) || WRAPS[0];
      const paletteHex = colors.length ? colors.map(id => COLORS.find(c => c.id === id)?.hex || C.petal) : [C.petal];

      // Expand stems into individual items with proper flower types
      const stems = [];
      Object.entries(qty).forEach(([fid, n]) => {
        for (let i = 0; i < n; i++) stems.push(fid);
      });

      const shown = stems.slice(0, 18);
      const n = Math.max(shown.length, 1);
      const cx = 160, apexY = 205;

      // Natural fan arrangement for stems
      const positions = shown.map((fid, i) => {
        const spread = Math.min(130, 36 + n * 6);
        const angle = n === 1 ? 0 : -spread / 2 + (spread / (n - 1)) * i;
        const rad = (angle * Math.PI) / 180;

        // Vary radius slightly across odd/even stems for realistic floral depth
        const radius = 75 + (i % 3) * 12 + (i % 2 === 0 ? 6 : -4);
        const x = cx + Math.sin(rad) * radius;
        const y = apexY - 55 - Math.cos(rad) * radius * 0.62 - (i % 3) * 5;
        const size = fid === "sunflower" ? 40 : (34 + (i % 3) * 4);

        // Color mapping: sunflowers default to golden, otherwise cycle through palette
        const color = (fid === "sunflower")
          ? "#FFC107"
          : (fid === "bluelily")
            ? "#1976D2"
            : (fid === "magentalily")
              ? "#C2185B"
              : paletteHex[i % paletteHex.length];

        return { fid, x, y, size, color, i, angle };
      });

      // Sort positions by Y coordinate so back flowers render behind front flowers
      const sortedPositions = [...positions].sort((a, b) => a.y - b.y);

      return (
        <div className="rounded-2xl p-5 flex flex-col items-center shadow-sm" style={{ backgroundColor: C.cream, border: `1px solid rgba(46,42,32,.08)` }}>
          <div className="w-full flex items-center justify-between mb-2">
            <span className="rcc-body text-[11px] font-bold uppercase tracking-wider text-stone-500">Live Bouquet Visualizer</span>
            <span className="rcc-body text-xs font-semibold px-2 py-0.5 rounded bg-pink-100 text-pink-800">{stems.length} Stems</span>
          </div>

          <svg viewBox="0 0 320 300" width="100%" height="240" className="overflow-visible">
            <defs>
              <filter id="bouquetGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#2E2A20" floodOpacity="0.12" />
              </filter>
            </defs>

            {/* 1. Stems emanating from apex to flower positions */}
            {positions.map((p) => (
              <g key={"stem-" + p.i}>
                <line x1={cx} y1={apexY + 8} x2={p.x} y2={p.y + 8} stroke="#425234" strokeWidth="2.8" strokeLinecap="round" opacity="0.7" />
                <path d={`M${(cx * 0.45 + p.x * 0.55)},${(apexY * 0.45 + p.y * 0.55)} Q${(cx * 0.45 + p.x * 0.55) + (p.i % 2 ? 7 : -7)},${(apexY * 0.45 + p.y * 0.55) - 5} ${(cx * 0.45 + p.x * 0.55) + (p.i % 2 ? 5 : -5)},${(apexY * 0.45 + p.y * 0.55) - 9}`}
                  stroke="#556B2F" strokeWidth="1.8" fill="none" strokeLinecap="round" opacity="0.6" />
              </g>
            ))}

            {/* 2. Flower Blooms (sorted for natural Z-depth) */}
            {sortedPositions.map((p) => (
              <g key={"bloom-" + p.i + "-" + p.fid} transform={`translate(${p.x}, ${p.y})`}>
                <FlowerBloom type={p.fid} color={p.color} size={p.size} delay={p.i * 28} />
              </g>
            ))}

            {/* 3. Luxury Bouquet Wrapper */}
            <g filter="url(#bouquetGlow)">
              <path d={`M${cx - 65},290 L${cx + 65},290 L${cx + 25},${apexY - 10} L${cx - 25},${apexY - 10} Z`}
                fill={wrap.hex} stroke="rgba(46,42,32,.18)" strokeWidth="1.5" />
              <path d={`M${cx - 65},290 L${cx},${apexY} L${cx + 65},290`} fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="1.5" />
              <path d={`M${cx - 30},290 L${cx - 5},${apexY} L${cx + 30},290`} fill="none" stroke="rgba(0,0,0,.08)" strokeWidth="1" />
              <path d={`M${cx},${apexY - 10} L${cx},290`} stroke="rgba(46,42,32,.15)" strokeWidth="1.2" strokeDasharray="3,3" />
            </g>

            {/* 4. Luxury Pearl Garland (if selected) */}
            {hasPearls && (
              <g className="bloom">
                <path d={`M${cx - 52},215 Q${cx},248 ${cx + 52},215`} fill="none" stroke="#FFFFFF" strokeWidth="5" strokeDasharray="3,7" strokeLinecap="round" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.2))" />
                <path d={`M${cx - 40},235 Q${cx},265 ${cx + 40},235`} fill="none" stroke="#FFFFFF" strokeWidth="4" strokeDasharray="2,6" strokeLinecap="round" opacity="0.85" />
              </g>
            )}

            {/* 5. Satin Ribbon & Bow (if selected) */}
            {hasRibbon && (
              <g className="bloom" transform={`translate(${cx}, ${apexY + 25})`}>
                <rect x="-42" y="-7" width="84" height="14" rx="3" fill={C.gold} filter="drop-shadow(0 1px 2px rgba(0,0,0,0.15))" />
                <path d="M0,0 C-14,-12 -26,-4 -14,0 C-26,4 -14,12 0,0" fill="#B3822E" opacity="0.9" />
                <path d="M0,0 C14,-12 26,-4 14,0 C26,4 14,12 0,0" fill="#B3822E" opacity="0.9" />
                <circle cx="0" cy="0" r="4.2" fill={C.gold} stroke="#996E25" strokeWidth="0.8" />
                <path d="M-3,3 Q-11,20 -15,32" stroke={C.gold} strokeWidth="2.8" strokeLinecap="round" fill="none" />
                <path d="M3,3 Q11,20 15,32" stroke={C.gold} strokeWidth="2.8" strokeLinecap="round" fill="none" />
              </g>
            )}

            {/* 6. Wax-Seal Greeting Card (if selected) */}
            {hasCard && (
              <g transform={`translate(${cx + 36}, 245) rotate(12)`} className="bloom" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.15))">
                <rect width="28" height="20" rx="3" fill="#FFFDF8" stroke="#D7CCC8" strokeWidth="1" />
                <line x1="4" y1="6" x2="24" y2="6" stroke="#BCAAA4" strokeWidth="1" strokeDasharray="1,2" />
                <line x1="4" y1="10" x2="20" y2="10" stroke="#BCAAA4" strokeWidth="1" strokeDasharray="1,2" />
                <circle cx="21" cy="14" r="3.5" fill="#AD5761" />
              </g>
            )}

            {/* 7. Calligraphy Name Tag (if selected) */}
            {hasNametag && (
              <g transform={`translate(${cx - 56}, 245) rotate(-10)`} className="bloom" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.15))">
                <rect width="26" height="15" rx="3" fill="#F5EBD8" stroke="#D7CCC8" strokeWidth="0.8" />
                <circle cx="4" cy="7.5" r="1.5" fill="#8D6E63" />
                <line x1="8" y1="7.5" x2="22" y2="7.5" stroke="#795548" strokeWidth="1" />
              </g>
            )}
          </svg>
          <p className="rcc-body text-xs mt-2 text-center text-stone-500">
            {stems.length === 0 ? "Click + on flower stems to assemble your custom arrangement" : `${stems.length} stem(s) selected`}
          </p>
        </div>
      );
    }

    const STEPS = ["Flowers", "Colors", "Size", "Wrapping", "Extras", "Message", "Review"];

    function Stepper({ step }) {
      return (
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
          {STEPS.map((s, i) => (
            <div key={s} className="flex items-center gap-1.5 shrink-0">
              <div className="rcc-body flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold" style={{ backgroundColor: i <= step ? C.petalDeep : C.canvas2, color: i <= step ? "#fff" : C.inkSoft, border: i <= step ? "none" : `1px solid rgba(46,42,32,.15)` }}>
                {i < step ? <Check size={12} /> : i + 1}
              </div>
              <span className="rcc-body text-xs font-semibold" style={{ color: i === step ? C.ink : C.inkSoft }}>{s}</span>
              {i < STEPS.length - 1 && <div className="w-4 h-px" style={{ backgroundColor: "rgba(46,42,32,.15)" }} />}
            </div>
          ))}
        </div>
      );
    }

    function OptionTile({ selected, onClick, children, className = "" }) {
      return <button onClick={onClick} className={`text-left rounded-2xl px-4 py-3 transition-all hover:-translate-y-0.5 ${className}`} style={{ border: `1.5px solid ${selected ? C.petalDeep : "rgba(46,42,32,.15)"}`, backgroundColor: selected ? "#F3DCDE" : C.cream }}>{children}</button>;
    }

    function Row({ label, value }) {
      return (
        <div className="flex flex-col sm:flex-row sm:justify-between gap-1 py-1 border-b border-stone-200/50 last:border-0">
          <span className="rcc-body text-xs uppercase font-semibold tracking-wide" style={{ color: C.inkSoft }}>{label}</span>
          <span className="rcc-body text-sm font-medium text-left sm:text-right" style={{ color: C.ink }}>{value}</span>
        </div>
      );
    }

    function Builder({ setPage, addToCart, inspirationRef }) {
      const [step, setStep] = useState(0);
      const [qty, setQty] = useState({ rose: 4, tulip: 4, lily: 2 });
      const [colors, setColors] = useState(["pink", "white"]);
      const [size, setSize] = useState("medium");
      const [wrap, setWrap] = useState("white");
      const [accessories, setAccessories] = useState(["ribbon", "pearls"]);
      const [message, setMessage] = useState("Happy Birthday! Wishing you everlasting joy.");
      const [refImage, setRefImage] = useState(inspirationRef ? inspirationRef.name : null);
      const [deliveryDate, setDeliveryDate] = useState("");
      const [added, setAdded] = useState(false);

      useEffect(() => {
        if (inspirationRef) setRefImage(inspirationRef.name);
      }, [inspirationRef]);

      const flowerCost = useMemo(() => FLOWERS_BUILDER.reduce((sum, f) => sum + (qty[f.id] || 0) * f.price, 0), [qty]);
      const sizeObj = SIZES.find((s) => s.id === size) || SIZES[2];
      const wrapObj = WRAPS.find((w) => w.id === wrap) || WRAPS[0];
      const accessoryCost = accessories.reduce((sum, id) => sum + (ACCESSORIES.find((a) => a.id === id)?.price || 0), 0);
      const total = flowerCost + sizeObj.price + wrapObj.price + accessoryCost + DELIVERY_FEE;
      const totalStems = Object.values(qty).reduce((a, b) => a + b, 0);
      const toggle = (list, setList, id) => setList(list.includes(id) ? list.filter((x) => x !== id) : [...list, id]);
      const next = () => setStep((s) => Math.min(s + 1, STEPS.length - 1));
      const back = () => setStep((s) => Math.max(s - 1, 0));
      const priceBreakdown = [["Flowers (" + totalStems + " stems)", flowerCost], [`Size (${sizeObj.name})`, sizeObj.price], [`Wrapping (${wrapObj.name})`, wrapObj.price], ["Accessories", accessoryCost], ["Express Delivery", DELIVERY_FEE]];

      return (
        <div style={{ backgroundColor: C.canvas, minHeight: "100vh", position: "relative", zIndex: 1 }}>
          <div className="mx-auto max-w-6xl px-4 py-6">
            <button onClick={() => setPage("home")} className="rcc-body text-sm font-medium flex items-center gap-1 mb-4 hover:opacity-70 transition-opacity" style={{ color: C.inkSoft }}>
              <ChevronLeft size={16} /> Back to shop
            </button>

            <div className="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 mb-2">
              <h1 className="rcc-display text-3xl sm:text-4xl font-bold" style={{ color: C.ink }}>Custom Bouquet Studio</h1>
              <span className="rcc-body text-xs text-stone-500 font-medium">Configure Every Stem & Ribbon</span>

            <div className="mb-8"><Stepper step={step} /></div>

            <div className="grid md:grid-cols-12 gap-8">
              <div className="md:col-span-7 space-y-6">

                {step === 0 && (
                  <div>

    // -------------------------------------------------------------------------------------
    // CHECKOUT MODAL (RAZORPAY & MANUAL UPI QR)
    // -------------------------------------------------------------------------------------
    function CheckoutModal({ isOpen, onClose, cart, onOrderSuccess, onOrderFailure }) {
      if (!isOpen) return null;

      const [customer, setCustomer] = useState({
        name: "",
        phone: "",
        email: "",
        address: "",
        city: "",
        state: "",
        pincode: "",
        notes: ""
      });

      const [paymentMethod, setPaymentMethod] = useState("RAZORPAY"); // "RAZORPAY" | "MANUAL_UPI"
      const [couponCode, setCouponCode] = useState("");
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [couponError, setCouponError] = useState("");
      const [validatingCoupon, setValidatingCoupon] = useState(false);

      // Manual UPI details
      const [utrNumber, setUtrNumber] = useState("");
      const [screenshotFile, setScreenshotFile] = useState(null);
      const [copiedUpi, setCopiedUpi] = useState(false);

      const [isProcessing, setIsProcessing] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const subtotal = cart.reduce((sum, item) => sum + (item.totalPrice || item.price || 0), 0);
      const shippingFee = subtotal >= 1999 ? 0 : 99;
      const discountAmount = appliedCoupon ? appliedCoupon.discount : 0;
      const grandTotal = Math.max(0, subtotal + shippingFee - discountAmount);

      const handleApplyCoupon = async () => {
        if (!couponCode.trim()) return;
        setValidatingCoupon(true);
        setCouponError("");
        try {
          const res = await fetch("/api/coupons/validate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: couponCode.trim(), subtotal })
          });
          const data = await res.json();
          if (data.valid) {
            setAppliedCoupon(data);
            setCouponError("");
          } else {
            setCouponError(data.message || "Invalid coupon");
            setAppliedCoupon(null);
          }
        } catch (err) {
          setCouponError("Could not validate coupon");
        } finally {
          setValidatingCoupon(false);
        }
      };

      const handleCopyUpi = () => {
        navigator.clipboard.writeText("rianandagawli11-1@okhdfcbank");
        setCopiedUpi(true);
        setTimeout(() => setCopiedUpi(false), 2500);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg("");

        if (!customer.name.trim()) return setErrorMsg("Please enter your full name.");
        if (!customer.phone.trim() || customer.phone.replace(/\D/g, "").length < 10) {
          return setErrorMsg("Please enter a valid 10-digit phone number.");
        }
        if (!customer.address.trim() || !customer.pincode.trim()) {
          return setErrorMsg("Please enter complete delivery address and pincode.");
        }

        if (paymentMethod === "MANUAL_UPI") {
          if (!utrNumber.trim() || utrNumber.trim().length < 6) {
            return setErrorMsg("Please enter the 12-digit UPI Transaction Reference (UTR) number.");
          }
        }

        setIsProcessing(true);

        try {
          // 1. Create order on backend (server calculates authoritative price)
          const createRes = await fetch("/api/orders/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              items: cart,
              customer,
              couponCode: appliedCoupon ? appliedCoupon.code : null,
              paymentMethod
            })
          });

          const orderData = await createRes.json();
          if (!orderData.success) {
            throw new Error(orderData.message || "Failed to initiate order");
          }

          // 2A. ONLINE PAYMENT VIA RAZORPAY
          if (paymentMethod === "RAZORPAY") {
            if (!window.Razorpay) {
              throw new Error("Razorpay Checkout SDK failed to load. Please check your internet connection.");
            }

            const options = {
              key: orderData.razorpayKeyId,
              amount: orderData.amountPaise,
              currency: "INR",
              name: "Riyas Creative Corner",
              description: `EverBloom Order #${orderData.orderId}`,
              image: "photos/Rose.jpeg",
              order_id: orderData.razorpayOrderId,
              prefill: {
                name: customer.name,
                contact: customer.phone,
                email: customer.email
              },
              theme: {
                color: "#AD5761"
              },
              handler: async function (response) {
                try {
                  // Server-side signature verification
                  const verifyRes = await fetch("/api/payments/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      orderId: orderData.orderId,
                      razorpay_order_id: response.razorpay_order_id,
                      razorpay_payment_id: response.razorpay_payment_id,
                      razorpay_signature: response.razorpay_signature
                    })
                  });

                  const verifyData = await verifyRes.json();
                  if (verifyData.success && verifyData.signatureVerified) {
                    onClose();
                    onOrderSuccess(verifyData.order);
                  } else {
                    onClose();
                    onOrderFailure({
                      orderId: orderData.orderId,
                      reason: verifyData.message || "Payment signature verification failed"
                    });
                  }
                } catch (err) {
                  onClose();
                  onOrderFailure({
                    orderId: orderData.orderId,
                    reason: err.message || "Error verifying payment"
                  });
                }
              },
              modal: {
                ondismiss: function () {
                  setIsProcessing(false);
                  onClose();
                  onOrderFailure({
                    orderId: orderData.orderId,
                    reason: "Payment window was closed before completion"
                  });
                }
              }
            };

            const rzp = new window.Razorpay(options);
            rzp.on("payment.failed", function (response) {
              setIsProcessing(false);
              onClose();
              onOrderFailure({
                orderId: orderData.orderId,
                reason: response.error?.description || "Payment failed at bank gateway"
              });
            });

            rzp.open();
            setIsProcessing(false);
          }
          // 2B. MANUAL UPI QR CODE
          else {
            const formData = new FormData();
            formData.append("orderId", orderData.orderId);
            formData.append("utr", utrNumber.trim());
            if (screenshotFile) {
              formData.append("screenshot", screenshotFile);
            }

            const upiRes = await fetch("/api/payments/manual-upi", {
              method: "POST",
              body: formData
            });

            const upiData = await upiRes.json();
            if (upiData.success) {
              setIsProcessing(false);
              onClose();
              onOrderSuccess(upiData.order, "MANUAL_UPI");
            } else {
              throw new Error(upiData.message || "Failed to submit UPI payment proof");
            }
          }

        } catch (err) {
          console.error("Checkout error:", err);
          setErrorMsg(err.message || "An unexpected error occurred during checkout.");
          setIsProcessing(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-sm overflow-y-auto" onClick={onClose}>
          <div className="relative max-w-2xl w-full my-6 rounded-3xl overflow-hidden shadow-2xl bg-white" onClick={(e) => e.stopPropagation()} style={{ backgroundColor: C.canvas }}>

            {/* Header */}
            <div className="p-5 border-b flex items-center justify-between" style={{ backgroundColor: C.cream, borderColor: "rgba(46,42,32,.1)" }}>
              <div className="flex items-center gap-2">
                <ShieldCheck size={22} style={{ color: C.leafDeep }} />
                <div>
                  <h2 className="rcc-display text-xl font-bold" style={{ color: C.ink }}>Secure Checkout</h2>
                  <p className="rcc-body text-xs text-stone-500">100% Secure Encrypted Payment Gateway</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-stone-200/60"><XIcon size={18} /></button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-6 max-h-[80vh] overflow-y-auto">

              {errorMsg && (
                <div className="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-red-500 shrink-0" />
                  <span>{errorMsg}</span>
                </div>
              )}

    // -------------------------------------------------------------------------------------
    // PAYMENT FAILURE MODAL
    // -------------------------------------------------------------------------------------
    function PaymentFailureModal({ failureData, isOpen, onClose, onRetrySuccess }) {
      if (!isOpen || !failureData) return null;
      const [retrying, setRetrying] = useState(false);

      const handleRetry = async () => {
        setRetrying(true);
        try {
          const res = await fetch(`/api/orders/${failureData.orderId}/retry-payment`, {
            method: "POST"
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.message || "Failed to re-initialize payment");

          const options = {
            key: data.razorpayKeyId,
            amount: data.amountPaise,
            currency: "INR",
            name: "Riyas Creative Corner",
            description: `Retry Payment for #${data.orderId}`,
            order_id: data.razorpayOrderId,
            prefill: {
              name: data.customer?.name,
              contact: data.customer?.phone
            },
            theme: { color: "#AD5761" },
            handler: async function (response) {
              const verifyRes = await fetch("/api/payments/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  orderId: data.orderId,
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature
                })
              });
              const verifyData = await verifyRes.json();
              if (verifyData.success) {
                onClose();
                onRetrySuccess(verifyData.order);
              } else {
                alert("Verification failed on retry: " + verifyData.message);
              }
            }
          };

          const rzp = new window.Razorpay(options);
          rzp.open();
        } catch (err) {
          alert("Retry error: " + err.message);
        } finally {
          setRetrying(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className="relative max-w-md w-full my-8 rounded-3xl overflow-hidden shadow-2xl bg-white p-6 sm:p-7 text-center" style={{ backgroundColor: C.canvas }}>
            <div className="w-14 h-14 mx-auto mb-3 rounded-full bg-red-100 flex items-center justify-center text-red-600">
              <XIcon size={28} />
            </div>

            <h2 className="rcc-display text-xl sm:text-2xl font-bold mb-1" style={{ color: C.ink }}>
              Payment Could Not Be Completed
            </h2>
            <p className="rcc-body text-xs text-stone-600 mb-4">
              {failureData.reason || "The transaction was cancelled or declined by your bank."}
            </p>

            <div className="p-3 rounded-xl bg-stone-100 text-left text-xs mb-5 font-mono">
              <span className="text-stone-500">Order Reference:</span> <span className="font-bold">#{failureData.orderId}</span>
            </div>

            <div className="flex flex-col gap-2.5">
              <button
                onClick={handleRetry}
                disabled={retrying}
                className="w-full rcc-body py-3.5 px-4 rounded-full text-xs font-bold text-white shadow transition flex items-center justify-center gap-1.5"
                style={{ backgroundColor: C.leafDeep }}>
                {retrying ? "Connecting..." : "Retry Payment Now 💳"}
              </button>
              <button
                onClick={onClose}
                className="w-full rcc-body py-2.5 px-4 rounded-full text-xs font-medium text-stone-600 hover:text-stone-900 transition">
                Return to Cart
              </button>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------------------
    // MAIN APP COMPONENT
    // -------------------------------------------------------------------------------------
    function App() {
      const [page, setPage] = useState("home");
      const [products, setProducts] = useState(PRODUCTS);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [inspirationRef, setInspirationRef] = useState(null);
      const [activeCategory, setActiveCategory] = useState("all");

      // Payment & Checkout States
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [confirmedOrder, setConfirmedOrder] = useState(null);
      const [failedOrder, setFailedOrder] = useState(null);
      const [isAdminOpen, setIsAdminOpen] = useState(false);

      // Dynamic Product Catalog Loading from Backend API
      useEffect(() => {
        const fetchProducts = async () => {
          try {
            const res = await fetch("/api/products");
            const data = await res.json();
            if (data.success && Array.isArray(data.products) && data.products.length > 0) {
              setProducts(data.products);
            }
          } catch (err) {
            console.warn("Using default catalog fallback:", err.message);
          }
        };
        fetchProducts();
      }, []);

      const addToCart = (item) => {
        setCart((c) => [...c, item]);
        setIsCartOpen(true);
      };

      const removeFromCart = (index) => {
        setCart((c) => c.filter((_, i) => i !== index));
      };

      const handleOpenBuilderWithRef = (product) => {
        setInspirationRef(product);
        setPage("builder");
      };

      return (
        <div className="rcc-body min-h-screen" style={{ backgroundColor: C.canvas }}>
          <TopNav
            setPage={setPage}
            cartCount={cart.length}
            onOpenCart={() => setIsCartOpen(true)}
            onSelectCategory={setActiveCategory}
            onOpenAdmin={() => setIsAdminOpen(true)}
          />

          {page === "home" ? (
            <Home
              setPage={setPage}
              onAddToCart={addToCart}
              onOpenProductDetail={setSelectedProduct}
              activeCategory={activeCategory}
              setActiveCategory={setActiveCategory}
              onOpenAdmin={() => setIsAdminOpen(true)}
              products={products}
            />
          ) : (
            <Builder
              setPage={setPage}
              addToCart={addToCart}
              inspirationRef={inspirationRef}
            />
          )}

          {/* Slide-over Basket */}
          <CartDrawer
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            items={cart}
            onRemove={removeFromCart}
            onCheckout={() => {
              setIsCartOpen(false);
              setIsCheckoutOpen(true);
            }}
          />

          {/* Product Detail Modal */}
          <ProductDetailModal
            product={selectedProduct}
            onClose={() => setSelectedProduct(null)}
            onAddToCart={addToCart}
            onOpenBuilderWithRef={handleOpenBuilderWithRef}
            onSelectRelated={(related) => setSelectedProduct(related)}
          />

          {/* Checkout Modal */}
          <CheckoutModal
            isOpen={isCheckoutOpen}
            onClose={() => setIsCheckoutOpen(false)}
            cart={cart}
            onOrderSuccess={(order) => {
              setCart([]);
              setConfirmedOrder(order);
            }}
            onOrderFailure={(failureInfo) => {
              setFailedOrder(failureInfo);
            }}
          />

          {/* Order Confirmation Modal */}
          <OrderConfirmationModal
            isOpen={!!confirmedOrder}
            order={confirmedOrder}
            onClose={() => setConfirmedOrder(null)}
          />

          {/* Payment Failure Modal with 1-Click Retry */}
          <PaymentFailureModal
            isOpen={!!failedOrder}
            failureData={failedOrder}
            onClose={() => setFailedOrder(null)}
            onRetrySuccess={(order) => {
              setCart([]);
              setFailedOrder(null);
              setConfirmedOrder(order);
            }}
          />

          {/* Admin Portal Modal (Visual No-Code Store Manager) */}
          <AdminDashboardModal
            isOpen={isAdminOpen}
            onClose={() => setIsAdminOpen(false)}
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
